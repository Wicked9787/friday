name: Native iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - friday-native
      - friday-integration-5
    paths:
      - "index.html"
      - "config.js"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "profiles/**"
      - "scriptable/**"
      - "friday-sky/**"
      - "friday-batsie/**"
      - "package.json"
      - "capacitor.config.js"
      - "scripts/**"
      - "plugins/**"
      - ".github/workflows/ios-native-build.yml"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build ${{ matrix.app_name }} (device IPA)
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sky
            app_name: Friday
            artifact_name: friday
          - profile: batsie
            app_name: Reed
            artifact_name: jarvis

    env:
      FRIDAY_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p build
          npm install --no-audit --no-fund 2>&1 | tee build/npm.log

      - name: Prepare the app bundle
        run: npm run build

      - name: Generate the iOS project
        run: npx cap add ios

      - name: Sync web assets into iOS
        run: |
          set -o pipefail
          npx cap sync ios 2>&1 | tee build/sync.log

      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/device.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" | head -80

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DeviceDerivedData/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../${{ matrix.artifact_name }}-unsigned.ipa Payload

      - name: Package a Lights-test IPA (carries the HomeKit permission for AltStore to sign)
        run: |
          cd build
          rm -rf lt && mkdir -p lt/Payload
          cp -R ipa/Payload/App.app lt/Payload/
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.developer.homekit</key><true/></dict></plist>
          PLIST
          sed -i '' 's/^          //' ent.plist
          if [ -d lt/Payload/App.app/Frameworks ]; then
            for f in lt/Payload/App.app/Frameworks/*; do codesign --force --sign - --timestamp=none "$f" || true; done
          fi
          codesign --force --sign - --timestamp=none --entitlements ent.plist lt/Payload/App.app
          codesign -d --entitlements :- lt/Payload/App.app | head -20
          cd lt && /usr/bin/zip -qry ../${{ matrix.artifact_name }}-lightstest.ipa Payload

      - name: Save unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-ios-unsigned-ipa
          path: build/${{ matrix.artifact_name }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Keep the IPA on a builds branch (fetchable with git)
        env:
          BRANCH: builds-${{ matrix.artifact_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub"
          cp "build/${{ matrix.artifact_name }}-unsigned.ipa" "$RUNNER_TEMP/pub/"
          cp "build/${{ matrix.artifact_name }}-lightstest.ipa" "$RUNNER_TEMP/pub/" || true
          cd "$RUNNER_TEMP/pub"
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${{ matrix.app_name }} build of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH:$BRANCH"

      - name: Keep the error log on a branch if the build failed (fetchable with git)
        if: failure()
        env:
          BRANCH: builds-log-${{ matrix.artifact_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          cd "$RUNNER_TEMP/log"
          (for f in npm sync device; do echo "===== $f"; grep -E "error|fatal|ERR|ERESOLVE|warn" -A3 "$GITHUB_WORKSPACE/build/$f.log" 2>/dev/null | head -200; tail -60 "$GITHUB_WORKSPACE/build/$f.log" 2>/dev/null; done) > build-errors.txt || true
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build log for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH:$BRANCH"
