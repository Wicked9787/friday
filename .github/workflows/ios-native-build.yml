name: Native iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - friday-native
    paths:
      - "index.html"
      - "config.js"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "profiles/**"
      - "scriptable/**"
      - "friday-sky/**"
      - "friday-batsie/**"
      - "package.json"
      - "capacitor.config.js"
      - "scripts/**"
      - ".github/workflows/ios-native-build.yml"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build ${{ matrix.app_name }} (simulator + device IPA)
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sky
            app_name: Friday
            artifact_name: friday
          - profile: batsie
            app_name: Jarvis
            artifact_name: jarvis

    env:
      FRIDAY_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare the app bundle
        run: npm run build

      - name: Generate the iOS project
        run: npx cap add ios

      - name: Sync web assets into iOS
        run: npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Save simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-ios-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DeviceDerivedData/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../${{ matrix.artifact_name }}-unsigned.ipa Payload

      - name: Save unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-ios-unsigned-ipa
          path: build/${{ matrix.artifact_name }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Keep the IPA on a builds branch (fetchable with git)
        env:
          BRANCH: builds-${{ matrix.artifact_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub"
          cp "build/${{ matrix.artifact_name }}-unsigned.ipa" "$RUNNER_TEMP/pub/"
          cd "$RUNNER_TEMP/pub"
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${{ matrix.app_name }} build of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH:$BRANCH"
