name: Shortcut signing test

on:
  push:
    branches: [friday-native]
    paths:
      - ".github/workflows/shortcut-sign-test.yml"
  workflow_dispatch:

jobs:
  sign-test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Make a tiny test shortcut
        run: |
          python3 - <<'EOF'
          import plistlib
          d = {
            "WFWorkflowClientVersion": "2302.0.4",
            "WFWorkflowMinimumClientVersion": 900,
            "WFWorkflowMinimumClientVersionString": "900",
            "WFWorkflowIcon": {"WFWorkflowIconStartColor": 4282601983, "WFWorkflowIconGlyphNumber": 59511},
            "WFWorkflowImportQuestions": [],
            "WFWorkflowTypes": [],
            "WFWorkflowInputContentItemClasses": ["WFStringContentItem"],
            "WFWorkflowActions": [
              {"WFWorkflowActionIdentifier": "is.workflow.actions.comment",
               "WFWorkflowActionParameters": {"WFCommentActionText": "Friday signing test"}}
            ],
          }
          with open("SignTest.shortcut", "wb") as f:
              plistlib.dump(d, f, fmt=plistlib.FMT_BINARY)
          EOF
          ls -la SignTest.shortcut
          sw_vers
          which shortcuts || echo "no shortcuts tool"

      - name: Try to sign it
        run: |
          set -x
          shortcuts sign --mode anyone --input SignTest.shortcut --output SignTest-signed.shortcut
          ls -la SignTest-signed.shortcut
          head -c 4 SignTest-signed.shortcut | xxd

      - name: Keep the signed file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sign-test
          path: SignTest-signed.shortcut
